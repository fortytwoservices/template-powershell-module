name: Publish Module to internal ACR
permissions:
  contents: read
  id-token: write

on:
  push:
    tags:
      - v*.*.*

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.FORTYTWO_INTERNAL_POWERSHELL_PUSH_CLIENTID }}
          tenant-id: ${{ vars.FORTYTWO_MANAGED_SERVICE_TENANTID }}
          allow-no-subscriptions: true
          enable-AzPSSession: true # Injects authentication into Az PowerShell module

      - name: Publish Module to internal ACR
        uses: azure/powershell@v3
        with:
          azPSVersion: "latest"
          inlineScript: |
            Write-Host "Registering repository"
            Register-PSResourceRepository -Name FortytwoInternal -Uri "${{ vars.FORTYTWO_INTERNAL_POWERSHELL_REPOSITORY }}" -Trusted -Priority 1

            Write-Host "Processing required modules"
            $psd1 = Get-ChildItem -Recurse -Include *.psd1
            $RequiredModules = Import-PowerShellDataFile $psd1.FullName | ForEach-Object RequiredModules
            if($RequiredModules) {
              $RequiredModuleSpecifications = $RequiredModules | ForEach-Object {
                $name = $null
                $minimumVersion = $null

                if($_ -is [string]) {
                  $name = $_
                } elseif($_ -is [System.Collections.IDictionary]) {
                  if($_.Contains('ModuleName')) { $name = $_['ModuleName'] }
                  if($_.Contains('ModuleVersion')) { $minimumVersion = $_['ModuleVersion'] }
                } elseif($_.PSObject.Properties.Name -contains 'ModuleName') {
                  $name = $_.ModuleName
                  if($_.PSObject.Properties.Name -contains 'ModuleVersion') {
                    $minimumVersion = $_.ModuleVersion
                  }
                }

                if([string]::IsNullOrWhiteSpace([string]$name)) {
                  throw "RequiredModules contains an entry without a valid ModuleName."
                }

                [pscustomobject]@{
                  Name = [string]$name
                  MinimumVersion = if($minimumVersion) { [string]$minimumVersion } else { $null }
                }
              }

              $RequiredModuleSpecifications |
              Group-Object Name |
              ForEach-Object { $_.Group | Select-Object -First 1 } |
              ForEach-Object {
                $parameters = @{
                  Name = $_.Name
                  Confirm = $false
                  Scope = 'CurrentUser'
                  ErrorAction = 'Stop'
                }
                if($_.MinimumVersion) {
                  $parameters.Version = "[$($_.MinimumVersion), ]"
                }

                Write-Host "Installing required module - $($_.Name)"
                try {
                  Write-Host "Installing required module from FortytwoInternal - $($_.Name)"
                  Install-PSResource @parameters -Repository FortytwoInternal
                } catch {
                  Write-Host "Module not found in FortytwoInternal, falling back to PSGallery - $($_.Name)"
                  Install-PSResource @parameters -Repository PSGallery -TrustRepository
                } 
              }
            }

            Write-Host "Publishing modules"
            $psd1 |
            ForEach-Object {
              Test-ModuleManifest $_.FullName

              $ModulePath = Split-Path -Parent $_.FullName
              $ModuleName = $_.BaseName
              Write-Host "Publishing module $ModuleName"
              Publish-PSResource -Path $ModulePath -Repository FortytwoInternal
            }
